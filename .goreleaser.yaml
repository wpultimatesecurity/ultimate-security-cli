version: 2

project_name: wpus

builds:
  - id: wpus
    main: ./cmd/wpus
    binary: wpus
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.Version={{.Version}}
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.GitCommit={{.Commit}}
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

# Homebrew packaging is deliberately absent: GoReleaser deprecated `brews` in
# favour of casks, and `wpultimatesecurity/homebrew-tap` does not exist yet, so
# a release would fail while publishing to it. Add a `homebrew_casks` entry and
# the tap repository together, before the first tag that should ship it.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: true
