version: 2

builds:
  - id: uscli
    main: ./cmd/uscli
    binary: uscli
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.Version={{.Version}}
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.GitCommit={{.Commit}}
      - -X github.com/wpultimatesecurity/ultimate-security-cli/internal/version.BuildDate={{.Date}}

archives:
  - id: default
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

brews:
  - name: uscli
    repository:
      owner: wpultimatesecurity
      name: homebrew-tap
    directory: Formula
    homepage: https://github.com/wpultimatesecurity/ultimate-security-cli
    description: Terminal UI for managing Ultimate Security WordPress plugin
    test: |
      system "#{bin}/uscli --version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
